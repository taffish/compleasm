[package]
name = "compleasm"
kind = "tool"
version = "0.2.8"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/compleasm"

[command]
name = "taf-compleasm"

[meta]
domain = "bio"
categories = ["genomics", "assembly-quality", "completeness", "busco", "annotation"]
keywords = ["compleasm", "busco", "genome-completeness", "miniprot", "hmmer", "sepp", "odb12", "odb12.2", "orthologs", "assembly-quality"]
description = "Fast genome and protein completeness assessment based on BUSCO marker genes and miniprot."

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/compleasm:0.2.8-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[upstream]
name = "Compleasm"
type = "github"
repo = "huangnengCSU/compleasm"
homepage = "https://github.com/huangnengCSU/compleasm"
release_url = "https://github.com/huangnengCSU/compleasm/releases/tag/v0.2.8"
downloads = "bioconda::compleasm=0.2.8=pyh106432d_0; https://github.com/huangnengCSU/compleasm/releases/download/v0.2.8/compleasm-0.2.8_x64-linux.tar.bz2"
version = "0.2.8"
license = "Apache-2.0 AND LicenseRef-BUSCO"
citation = "Huang and Li 2023"
doi = "10.1093/bioinformatics/btad595"
pmid = "37758247"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 180
exist = ["compleasm", "miniprot", "hmmsearch", "run_sepp.py", "python"]
test = ["compleasm --version | grep -F 'compleasm 0.2.8' >/dev/null", "compleasm --help | grep -F 'Compleasm modules help' >/dev/null", "compleasm run --help | grep -F 'usage: compleasm run' >/dev/null", "compleasm run --help | grep -F -- '--odb' >/dev/null", "compleasm analyze --help | grep -F 'usage: compleasm analyze' >/dev/null", "compleasm analyze --help | grep -F -- '--odb' >/dev/null", "compleasm download --help | grep -F 'usage: compleasm download' >/dev/null", "compleasm list --help | grep -F 'usage: compleasm list' >/dev/null", "compleasm list --help | grep -F -- '--odb' >/dev/null", "compleasm miniprot --help | grep -F 'usage: compleasm miniprot' >/dev/null", "compleasm protein --help | grep -F 'usage: compleasm protein' >/dev/null", "miniprot --version 2>&1 | grep -F '0.18' >/dev/null", "hmmsearch -h | grep -F 'HMMER' >/dev/null", "run_sepp.py -h | grep -F 'usage: run_sepp.py' >/dev/null", "python -c 'import pandas, dendropy; import compleasm'", "mkdir -p /tmp/taf-compleasm-test && cd /tmp/taf-compleasm-test && printf '>chr1\\nATGAAAACCGCTTACATTGCTAAACAACGTCAAATTTCTTTTGTTAAATCTCATTTTTCTCGTCAACTGGAAGAACGTCTGGGTCTGATTGAAGTTCAAGCTAATAAT\\n' > genome.fa && printf '>prot1\\nMKTAYIAKQRQISFVKSHFSRQLEERLGLIEVQANN\\n' > proteins.faa && compleasm miniprot -a genome.fa -p proteins.faa -o miniprot-out -t 1 >/dev/null && test -s miniprot-out/miniprot_output.gff && test -e miniprot-out/miniprot.done"]
